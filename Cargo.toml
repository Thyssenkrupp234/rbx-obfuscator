[package]
name = "rbx-obfuscator"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "rbxl_obfuscate"

[[bin]]
name = "rbx-obfuscator"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
rbx_binary = "2.0"
rbx_dom_weak = "4.1"
rbx_xml = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
